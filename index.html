<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moka Studios</title>
  <meta name="description" content="Moka Studios LLC is a creative developer studio building video games and apps.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8a657'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%231a120d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a120d;
      --bg-2: #241812;
      --ink: #f4ebe1;
      --muted: #b89f8a;
      --accent: #e8a657;
      --accent-2: #c9733b;
      --line: rgba(244, 235, 225, 0.12);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(60vw 60vw at 85% 10%, rgba(232, 166, 87, 0.18), transparent 60%),
        radial-gradient(50vw 50vw at 10% 90%, rgba(201, 115, 59, 0.14), transparent 60%);
      z-index: 0;
    }
    header, main, footer { position: relative; z-index: 1; }

    .wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 20px; }


    main { flex: 1; display: flex; align-items: center; }
    .hero { padding: 40px 0 64px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .illo { width: 100%; max-width: 380px; height: auto; display: block; }
    .illo .steam { animation: steam 3.2s ease-in-out infinite; transform-origin: center bottom; }
    .illo .steam:nth-child(2) { animation-delay: 0.8s; }
    .illo .steam:nth-child(3) { animation-delay: 1.6s; }
    .illo .ear { animation: flick 2.8s ease-in-out infinite; transform-origin: 196px 88px; }
    .illo .ear-r { transform-origin: 244px 88px; animation-direction: reverse; animation-delay: 0.4s; }
    @keyframes steam {
      0%, 100% { opacity: 0.25; transform: translateY(0) scaleY(1); }
      50% { opacity: 0.8; transform: translateY(-8px) scaleY(1.1); }
    }
    @keyframes flick {
      0%, 85%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(-10deg); }
      95% { transform: rotate(6deg); }
    }


    footer {
      text-align: center;
      padding: 24px 0;
      font-size: 14px;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
        .illo .steam, .illo .ear { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="wrap hero">
      <svg class="illo" viewBox="0 0 440 320" role="img" aria-label="A dog peeking out of a steaming coffee cup">
        <!-- table shadow -->
        <ellipse cx="220" cy="296" rx="170" ry="12" fill="rgba(232,166,87,0.10)"/>
        <!-- steam -->
        <g fill="none" stroke="#f4ebe1" stroke-width="5" stroke-linecap="round">
          <path class="steam" d="M140 120c-10-14 10-22 0-38"/>
          <path class="steam" d="M300 120c-10-14 10-22 0-38"/>
          <path class="steam" d="M322 136c-10-14 10-22 0-38"/>
        </g>
        <!-- cup interior (behind dog) -->
        <ellipse cx="220" cy="160" rx="100" ry="20" fill="#3a2418"/>
        <ellipse cx="220" cy="158" rx="88" ry="14" fill="#5a3522"/>
        <!-- dog -->
        <g>
          <!-- ears (big, rounded, set out to the sides) -->
          <g class="ear">
            <path d="M216 74 C204 52 182 14 160 8 C146 4 138 18 142 34 C148 58 164 82 180 96z" fill="#1c1a1a"/>
            <path d="M206 78 C196 60 178 30 162 22 C154 20 152 30 156 40 C162 56 174 74 186 88z" fill="#c98a5a"/>
          </g>
          <g class="ear ear-r">
            <path d="M224 74 C236 52 258 14 280 8 C294 4 302 18 298 34 C292 58 276 82 260 96z" fill="#1c1a1a"/>
            <path d="M234 78 C244 60 262 30 278 22 C286 20 288 30 284 40 C278 56 266 74 254 88z" fill="#c98a5a"/>
          </g>
          <!-- head -->
          <ellipse cx="220" cy="106" rx="50" ry="46" fill="#1c1a1a"/>
          <!-- tan cheeks -->
          <path d="M174 120c6 20 22 32 46 32s40-12 46-32c-10 8-28 14-46 14s-36-6-46-14z" fill="#c98a5a"/>
          <!-- white blaze and muzzle -->
          <path d="M213 74c-2 20-5 36-11 50 2 20 10 30 18 30s16-10 18-30c-6-14-9-30-11-50z" fill="#f4ebe1"/>
          <ellipse cx="220" cy="130" rx="28" ry="18" fill="#f4ebe1"/>
          <!-- tan eyebrows -->
          <ellipse cx="199" cy="92" rx="9" ry="5" fill="#c98a5a"/>
          <ellipse cx="241" cy="92" rx="9" ry="5" fill="#c98a5a"/>
          <!-- eyes -->
          <circle cx="200" cy="104" r="8" fill="#7a4a22"/>
          <circle cx="240" cy="104" r="8" fill="#7a4a22"/>
          <circle cx="200" cy="105" r="4.5" fill="#1a120d"/>
          <circle cx="240" cy="105" r="4.5" fill="#1a120d"/>
          <circle cx="203" cy="101" r="2.2" fill="#f4ebe1"/>
          <circle cx="243" cy="101" r="2.2" fill="#f4ebe1"/>
          <!-- nose and mouth -->
          <ellipse cx="220" cy="124" rx="9" ry="7" fill="#1c1a1a"/>
          <path d="M210 136c4 6 16 6 20 0" fill="none" stroke="#1c1a1a" stroke-width="3" stroke-linecap="round"/>
          <!-- tongue -->
          <path d="M214 140h12v6a6 6 0 0 1-12 0z" fill="#e26b6b"/>
          <!-- neck/shoulders down into the cup, white chest -->
          <path d="M184 142h72v40h-72z" fill="#1c1a1a"/>
          <path d="M204 142h32v40h-32z" fill="#f4ebe1"/>
          <!-- paws on the rim -->
          <rect x="166" y="150" width="30" height="20" rx="10" fill="#f4ebe1"/>
          <rect x="244" y="150" width="30" height="20" rx="10" fill="#f4ebe1"/>
          <path d="M176 160v6M186 160v6M254 160v6M264 160v6" stroke="#b89f8a" stroke-width="2" stroke-linecap="round"/>
        </g>
        <!-- cup front -->
        <path d="M120 162h200v70a56 56 0 0 1-56 56h-88a56 56 0 0 1-56-56z" fill="#e8a657"/>
        <path d="M120 162a100 20 0 0 0 200 0" fill="#f1b86f"/>
        <!-- handle -->
        <path d="M320 186h18a30 30 0 0 1 0 60h-18" fill="none" stroke="#e8a657" stroke-width="16" stroke-linecap="round"/>
        <!-- cup label: coffee bean -->
        <ellipse cx="220" cy="228" rx="18" ry="24" fill="#8f4a22" transform="rotate(-25 220 228)"/>
        <path d="M212 206c12 14 4 30 8 46" fill="none" stroke="#e8a657" stroke-width="4" stroke-linecap="round" transform="rotate(-25 220 228)"/>
      </svg>
    </div>
  </main>

  <footer>
    <div class="wrap">&copy; 2026 Moka Studios LLC</div>
  </footer>
</body>
</html>
